<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tahun Baru 01 - Tanpa Kata Colection</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap"
        rel="stylesheet"
    >
    <style>
        /* KOMEN KRUSIAL: Pengaturan transisi & font dasar */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        /* KOMEN KRUSIAL: Ganti warna card, latar, border, dan teks Mode Terang di sini */
        :root {
            --bg-gradient: linear-gradient(135deg, #fffbeb 0%, #fef3c7 55%, #e0f2fe 100%);
            --card-bg: #ffffff;
            --inner-bg: #fffdf5;
            --border-primary: #d97706;
            --border-accent: #0284c7;
            --shadow: 0 20px 42px rgba(217, 119, 6, 0.16);
            --text-main: #1e293b;
            --text-sub: #475569;
            --title-color: #b45309;
            --btn-bg: #fef3c7;
            --btn-text: #92400e;
            --btn-border: #d97706;
        }

        /* KOMEN KRUSIAL: Ganti warna card, latar, border, dan teks Mode Gelap di sini */
        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #090d1a 0%, #172554 55%, #0f172a 100%);
            --card-bg: #111827;
            --inner-bg: #1e293b;
            --border-primary: #fbbf24;
            --border-accent: #38bdf8;
            --shadow: 0 20px 42px rgba(0, 0, 0, 0.55);
            --text-main: #f8fafc;
            --text-sub: #cbd5e1;
            --title-color: #fde047;
            --btn-bg: #1e293b;
            --btn-text: #fde047;
            --btn-border: #fbbf24;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 64px 16px 24px 16px;
            position: relative;
        }

        .theme-container {
            position: absolute;
            top: 16px;
            right: 20px;
            z-index: 100;
        }

        .theme-btn {
            background: var(--card-bg);
            border: 1.5px solid var(--btn-border);
            color: var(--btn-text);
            padding: 7px 13px;
            border-radius: 50px;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* KOMEN KRUSIAL: Border desain 01 (bingkai ganda solid + aksen garis putus di dalam) */
        .newyear-card {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border-radius: 26px;
            border: 3px solid var(--border-primary);
            box-shadow: var(--shadow), inset 0 0 0 4px var(--inner-bg), inset 0 0 0 6px var(--border-accent);
            padding: 32px 22px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .ny-badge {
            background: var(--inner-bg);
            color: var(--title-color);
            border: 1.5px solid var(--border-accent);
            font-size: 11px;
            font-weight: 700;
            padding: 5px 14px;
            border-radius: 999px;
        }

        /* KOMEN KRUSIAL: Ukuran ikon gambar ucapan */
        .icon-display {
            font-size: clamp(2.8rem, 8vw, 3.8rem);
            line-height: 1.2;
        }

        .greeting-box h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.7rem, 5vw, 2.2rem);
            color: var(--title-color);
            margin-bottom: 10px;
        }

        .greeting-box p {
            font-size: clamp(0.92rem, 3.2vw, 1.05rem);
            color: var(--text-sub);
            line-height: 1.7;
        }

        .back-btn {
            background: var(--btn-bg);
            color: var(--btn-text);
            border: 1.5px solid var(--btn-border);
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
        }

        .footer-note {
            font-size: 11px;
            color: var(--text-sub);
            margin-top: 14px;
            text-align: center;
        }

        @media (max-width: 600px) {
            body {
                padding: 56px 12px 20px 12px;
            }
            .newyear-card {
                padding: 26px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="theme-container">
        <button class="theme-btn" onclick="toggleTheme()">
            🌓 <span id="themeText">Mode Gelap</span>
        </button>
    </div>

    <main class="newyear-card">
        <span class="ny-badge">🎆 HAPPY NEW YEAR • 01</span>
        <div class="icon-display" aria-hidden="true">🥂🎆✨</div>
        <div class="greeting-box">
            <h1>Selamat Tahun Baru</h1>
            <p>
                Semoga lembaran tahun yang baru membawa harapan segar, langkah yang makin mantap,
                kesehatan yang terjaga, dan kebahagiaan yang terus bertumbuh setiap hari.
            </p>
        </div>
        <!-- KOMEN KRUSIAL: Ganti tujuan link kembali ke katalog jika diperlukan -->
        <a href="../katalog.html#tahunbaru" class="back-btn">⬅ Kembali ke Kategori</a>
    </main>

    <p class="footer-note">&copy; 2026 Tanpa Kata.colection. All Rights Reserved.</p>

    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const themeText = document.getElementById('themeText');
            if (html.getAttribute('data-theme') === 'dark') {
                html.removeAttribute('data-theme');
                themeText.innerText = 'Mode Gelap';
            } else {
                html.setAttribute('data-theme', 'dark');
                themeText.innerText = 'Mode Terang';
            }
        }
    </script>
</body>
</html>
