<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tahun Baru 04 - Tanpa Kata Colection</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap"
        rel="stylesheet"
    >
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        /* KOMEN KRUSIAL: Ganti warna card & border Mode Terang di sini */
        :root {
            --bg-gradient: linear-gradient(135deg, #f5f3ff 0%, #ede9fe 55%, #e0f2fe 100%);
            --card-bg: #ffffff;
            --inner-bg: #f5f3ff;
            --border-primary: #7c3aed;
            --border-accent: #0ea5e9;
            --shadow: 0 20px 40px rgba(124, 58, 237, 0.16);
            --text-main: #1e1b4b;
            --text-sub: #4c1d95;
            --title-color: #6d28d9;
            --btn-bg: #ede9fe;
            --btn-text: #5b21b6;
            --btn-border: #7c3aed;
        }

        /* KOMEN KRUSIAL: Ganti warna card & border Mode Gelap di sini */
        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #0d091f 0%, #24154d 55%, #0f172a 100%);
            --card-bg: #171033;
            --inner-bg: #23184d;
            --border-primary: #c084fc;
            --border-accent: #38bdf8;
            --shadow: 0 20px 42px rgba(0, 0, 0, 0.55);
            --text-main: #f5f3ff;
            --text-sub: #ddd6fe;
            --title-color: #38bdf8;
            --btn-bg: #23184d;
            --btn-text: #e9d5ff;
            --btn-border: #c084fc;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 64px 16px 24px 16px;
            position: relative;
        }

        .theme-container {
            position: absolute;
            top: 16px;
            right: 20px;
            z-index: 100;
        }

        .theme-btn {
            background: var(--card-bg);
            border: 1.5px solid var(--btn-border);
            color: var(--btn-text);
            padding: 7px 13px;
            border-radius: 50px;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* KOMEN KRUSIAL: Border desain 04 (bingkai titik-titik + ring luar aksen biru) */
        .newyear-card {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border-radius: 34px;
            border: 4px dotted var(--border-primary);
            box-shadow: 0 0 0 3px var(--border-accent), var(--shadow);
            padding: 32px 22px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .ny-badge {
            background: var(--inner-bg);
            color: var(--title-color);
            border: 1.5px solid var(--border-accent);
            font-size: 11px;
            font-weight: 700;
            padding: 5px 14px;
            border-radius: 999px;
        }

        .icon-display {
            font-size: clamp(2.8rem, 8vw, 3.8rem);
            line-height: 1.2;
        }

        .greeting-box h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.65rem, 5vw, 2.15rem);
            color: var(--title-color);
            margin-bottom: 10px;
        }

        .greeting-box p {
            font-size: clamp(0.92rem, 3.2vw, 1.05rem);
            color: var(--text-sub);
            line-height: 1.7;
        }

        .back-btn {
            background: var(--btn-bg);
            color: var(--btn-text);
            border: 1.5px solid var(--btn-border);
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
        }

        .footer-note {
            font-size: 11px;
            color: var(--text-sub);
            margin-top: 14px;
            text-align: center;
        }

        @media (max-width: 600px) {
            body {
                padding: 56px 12px 20px 12px;
            }
            .newyear-card {
                padding: 26px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="theme-container">
        <button class="theme-btn" onclick="toggleTheme()">
            🌓 <span id="themeText">Mode Gelap</span>
        </button>
    </div>

    <main class="newyear-card">
        <span class="ny-badge">✨ CERITA BARU • 04</span>
        <div class="icon-display" aria-hidden="true">🪄✨🎆</div>
        <div class="greeting-box">
            <h1>Tahun Baru Penuh Makna</h1>
            <p>
                Semoga tahun ini menjadi ruang tumbuh yang hangat, penuh keberanian mencoba hal
                baik, serta dikelilingi orang-orang tulus yang selalu mendukung.
            </p>
        </div>
        <a href="../katalog.html#tahunbaru" class="back-btn">⬅ Kembali ke Kategori</a>
    </main>

    <p class="footer-note">&copy; 2026 Tanpa Kata.colection. All Rights Reserved.</p>

    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const themeText = document.getElementById('themeText');
            if (html.getAttribute('data-theme') === 'dark') {
                html.removeAttribute('data-theme');
                themeText.innerText = 'Mode Gelap';
            } else {
                html.setAttribute('data-theme', 'dark');
                themeText.innerText = 'Mode Terang';
            }
        }
    </script>
</body>
</html>
