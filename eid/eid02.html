<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idul Fitri 02 - Tanpa Kata Colection</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap"
        rel="stylesheet"
    >
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        /* KOMEN KRUSIAL: Ganti warna card, latar, border, dan teks Mode Terang di sini */
        :root {
            --bg-gradient: linear-gradient(135deg, #fefce8 0%, #fef3c7 55%, #ecfdf5 100%);
            --card-bg: #ffffff;
            --inner-bg: #fffdf5;
            --border-primary: #4d7c0f;
            --border-accent: #d97706;
            --shadow: 0 20px 42px rgba(77, 124, 15, 0.16);
            --text-main: #1e293b;
            --text-sub: #3f6212;
            --title-color: #365314;
            --btn-bg: #ecfccb;
            --btn-text: #365314;
            --btn-border: #4d7c0f;
        }

        /* KOMEN KRUSIAL: Ganti warna card, latar, border, dan teks Mode Gelap di sini */
        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #101905 0%, #1f2e0a 55%, #0f172a 100%);
            --card-bg: #172407;
            --inner-bg: #24380c;
            --border-primary: #a3e635;
            --border-accent: #fbbf24;
            --shadow: 0 20px 42px rgba(0, 0, 0, 0.55);
            --text-main: #f7fee7;
            --text-sub: #d9f99d;
            --title-color: #fde047;
            --btn-bg: #24380c;
            --btn-text: #fde047;
            --btn-border: #a3e635;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 64px 16px 24px 16px;
            position: relative;
        }

        .theme-container {
            position: absolute;
            top: 16px;
            right: 20px;
            z-index: 100;
        }

        .theme-btn {
            background: var(--card-bg);
            border: 1.5px solid var(--btn-border);
            color: var(--btn-text);
            padding: 7px 13px;
            border-radius: 50px;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* KOMEN KRUSIAL: Border desain 02 (bingkai tipis zaitun + siku sudut tebal emas ::before & ::after) */
        .eid-card {
            position: relative;
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border-radius: 16px;
            border: 2px solid var(--border-primary);
            box-shadow: var(--shadow);
            padding: 32px 22px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .eid-card::before,
        .eid-card::after {
            content: "";
            position: absolute;
            width: 34px;
            height: 34px;
            border-color: var(--border-accent);
            border-style: solid;
            pointer-events: none;
        }

        .eid-card::before {
            top: -4px;
            left: -4px;
            border-width: 5px 0 0 5px;
            border-top-left-radius: 14px;
        }

        .eid-card::after {
            bottom: -4px;
            right: -4px;
            border-width: 0 5px 5px 0;
            border-bottom-right-radius: 14px;
        }

        .eid-badge {
            background: var(--inner-bg);
            color: var(--title-color);
            border: 1.5px solid var(--border-primary);
            font-size: 11px;
            font-weight: 700;
            padding: 5px 14px;
            border-radius: 8px;
        }

        /* KOMEN KRUSIAL: Ukuran ikon gambar ucapan */
        .icon-display {
            font-size: clamp(2.8rem, 8vw, 3.8rem);
            line-height: 1.2;
        }

        .greeting-box h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.65rem, 5vw, 2.15rem);
            color: var(--title-color);
            margin-bottom: 10px;
        }

        .greeting-box p {
            font-size: clamp(0.92rem, 3.2vw, 1.05rem);
            color: var(--text-sub);
            line-height: 1.7;
        }

        /* KOMEN KRUSIAL: Ganti tujuan link kembali ke kategori jika diperlukan */
        .back-btn {
            background: var(--btn-bg);
            color: var(--btn-text);
            border: 1.5px solid var(--btn-border);
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
        }

        .footer-note {
            font-size: 11px;
            color: var(--text-sub);
            margin-top: 14px;
            text-align: center;
        }

        @media (max-width: 600px) {
            body {
                padding: 56px 12px 20px 12px;
            }
            .eid-card {
                padding: 26px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="theme-container">
        <button class="theme-btn" onclick="toggleTheme()">
            🌓 <span id="themeText">Mode Gelap</span>
        </button>
    </div>

    <main class="eid-card">
        <span class="eid-badge">🌙 FITRI YANG SUCI • 02</span>
        <div class="icon-display" aria-hidden="true">🌙🤲✨</div>
        <div class="greeting-box">
            <h1>Mohon Maaf Lahir & Batin</h1>
            <p>
                Di hari kemenangan yang penuh berkah ini, semoga Allah menerima amal ibadah kita dan
                melimpahkan kedamaian bagi seluruh keluarga.
            </p>
        </div>
        <a href="../katalog.html#idulfitri" class="back-btn">⬅ Kembali ke Kategori</a>
    </main>

    <p class="footer-note">&copy; 2026 Tanpa Kata.colection. All Rights Reserved.</p>

    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const themeText = document.getElementById('themeText');
            if (html.getAttribute('data-theme') === 'dark') {
                html.removeAttribute('data-theme');
                themeText.innerText = 'Mode Gelap';
            } else {
                html.setAttribute('data-theme', 'dark');
                themeText.innerText = 'Mode Terang';
            }
        }
    </script>
</body>
</html>
